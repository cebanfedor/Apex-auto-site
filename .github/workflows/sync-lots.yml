# Ежечасная синхронизация каталога аукционов в Supabase (см. api/sync-lots.js).
# Пока идёт первичный полный импорт, endpoint возвращает continue:true —
# цикл прокачивает страницы подряд; после этого один вызов в час обновляет
# изменённые лоты и помечает проданные. Секретов не требует: endpoint публичный,
# защищён внутренним локом.
name: Sync auction lots
on:
  schedule:
    # Основное расписание — Vercel Cron (vercel.json: /api/cron/sync каждые 5 мин, closed/settle каждые 10).
    # GitHub cron срабатывал 5–6 раз в СУТКИ (23.09.2026) — здесь только резервный запуск.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Pump sync endpoint
        run: |
          for i in $(seq 1 20); do
            out=$(curl -s --max-time 120 "https://apexauto.md/api/sync-lots?source=gha" || echo '{"ok":false}')
            echo "[$i] $out"
            echo "$out" | grep -q '"continue":true' || break
            sleep 2
          done
      # После синка база свободна — прогреваем CDN-кэш витрины каталога,
      # чтобы первый посетитель не ловил медленный MISS.
      - name: Warm showcase CDN cache
        run: |
          # Адреса — РОВНО те, что запрашивает сайт (иначе прогрев мимо кэша): витрина каталога
          # (per_page=30, типы 1/2/5/7), блок на главной, счётчики вкладок.
          for id in 1 2 5 7; do
            curl -s -o /dev/null -w "warm type=$id: %{time_total}s %header{x-vercel-cache}\n" \
              "https://apexauto.md/api/auctions?action=search&per_page=30&vehicleType=$id&sort=smart&auction=all&tab=all"
          done
          for tab in soon archived buy_now; do
            curl -s -o /dev/null -w "warm tab=$tab: %{time_total}s\n" \
              "https://apexauto.md/api/auctions?action=search&auction=all&sort=smart&per_page=1&tab=$tab"
          done
          curl -s -o /dev/null -w "warm showcase: %{time_total}s\n" "https://apexauto.md/api/auctions?action=showcase"
          curl -s -o /dev/null -w "warm transit: %{time_total}s\n" "https://apexauto.md/api/hot-lots?type=transit"

  closed:
    # Каждые 10 минут: только закрытые за последние 90 мин торги → архив без часового лага.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync closed lots
        run: curl -s --max-time 60 "https://apexauto.md/api/auctions?action=syncclosed&source=gha"
      - name: Settle lots whose auction just ended
        run: curl -s --max-time 60 "https://apexauto.md/api/auctions?action=syncsettle&source=gha"
