<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка отсева визуальных дублей</title>
<style>body{font:14px system-ui;margin:20px} pre{background:#f4f5f7;padding:12px;border-radius:8px} img{width:70px;height:52px;object-fit:cover;border:2px solid #ddd;margin:2px}</style></head>
<body>
<h1>Отсев визуальных дублей</h1>
<div id="gallery"></div>
<pre id="out">…</pre>
<script src="/chrome-extension/src/common/util.js"></script>
<script src="/chrome-extension/src/common/image-dedupe.js"></script>
<script>
(async function(){
  // рисуем набор: 3 одинаковые «таблички», 2 почти одинаковых «панорамы», 3 разных кадра
  function make(text, hue, noise){
    const c=document.createElement('canvas'); c.width=160; c.height=120;
    const g=c.getContext('2d');
    g.fillStyle=`hsl(${hue},60%,${50+ (noise||0)}%)`; g.fillRect(0,0,160,120);
    g.fillStyle='#111'; g.font='bold 22px system-ui'; g.fillText(text,10,64);
    if(noise){ g.fillStyle='rgba(0,0,0,0.05)'; g.fillRect(0,0,4,120); }
    return c.toDataURL('image/jpeg',0.9);
  }
  const urls=[
    make('AUTO','210'), make('AUTO','210',1),      // почти одинаковые — дубль
    make('VIN','40'), make('VIN','40',1), make('VIN','40',2), // три снимка таблички
    make('SALON','120'), make('MOTOR','0'), make('KOLESO','280')
  ];
  document.getElementById('gallery').innerHTML=urls.map((u,i)=>`<img src="${u}" title="${i+1}">`).join('');
  const res=await window.ApexX.imageDedupe.dedupeByContent(urls);
  document.getElementById('out').textContent =
    'было кадров: '+urls.length+'\nосталось: '+res.images.length+'\nубрано дублей: '+res.removed+
    '\nномера оставшихся: '+res.images.map(u=>urls.indexOf(u)+1).join(', ');
})();
</script>
</body></html>
